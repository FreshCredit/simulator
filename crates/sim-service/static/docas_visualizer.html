<!DOCTYPE html>
<html>
<head>
    <title>DOCAS Visualization</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
        .container { max-width: 1200px; margin: 0 auto; }
        .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .metric { background: #16213e; padding: 15px; border-radius: 8px; text-align: center; }
        .metric-value { font-size: 2em; font-weight: bold; }
        .metric-label { font-size: 0.9em; opacity: 0.8; margin-top: 5px; }
        .dopamine { color: #ff6b6b; }
        .oxytocin { color: #4ecdc4; }
        .cortisol { color: #ffe66d; }
        .adrenaline { color: #ff9f43; }
        .serotonin { color: #a29bfe; }
        #chart { width: 100%; height: 400px; background: #16213e; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 DOCAS Real-Time Visualization</h1>
        <div class="metrics">
            <div class="metric">
                <div class="metric-value dopamine" id="dopamine">0.50</div>
                <div class="metric-label">Dopamine (D)</div>
            </div>
            <div class="metric">
                <div class="metric-value oxytocin" id="oxytocin">0.55</div>
                <div class="metric-label">Oxytocin (O)</div>
            </div>
            <div class="metric">
                <div class="metric-value cortisol" id="cortisol">0.35</div>
                <div class="metric-label">Cortisol (C)</div>
            </div>
            <div class="metric">
                <div class="metric-value adrenaline" id="adrenaline">0.45</div>
                <div class="metric-label">Adrenaline (A)</div>
            </div>
            <div class="metric">
                <div class="metric-value serotonin" id="serotonin">0.60</div>
                <div class="metric-label">Serotonin (S)</div>
            </div>
        </div>
        <div id="chart">
            <canvas id="docasChart"></canvas>
        </div>
    </div>
    <script src="/api/docas/docas.js" defer></script>
</body>
</html>
