# Low Variance: Strong selection pressure, narrow range
# pde4b_factor ∈ [0.48, 0.52], σ = 0.01

[experiment]
name = "pde4b_low_variance"
description = "Low PDE4B variance (σ = 0.01)"
replications = 30
random_seed = 42

[genome]
pde4b_variance_condition = "low"
pde4b_range = [0.48, 0.52]
pde4b_std_dev = 0.01
heritability_h2 = 0.28

# Learning rate range: λ ∈ [0.235, 0.265]
learning_rate_range = [0.235, 0.265]

[sweep]
enabled = true
parameter = "pde4b_factor"
range = [0.48, 0.52]
steps = 5

[metrics]
track_trust_variance = true
track_trust_inequality_gini = true
track_cooperation_rate = true
track_learning_rate_distribution = true
track_emotional_states = true
track_criticality = true
track_group_formation = true

[output]
save_trajectories = true
save_genome_snapshots = true
snapshot_interval_ticks = 50
