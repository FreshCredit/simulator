[package]
name = "testnet-agent-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Testnet agent bridge - anchors simulation results to FreshCredit testnet"

repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[dependencies]
# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower-http = { workspace = true }
http = "1.0"

# Substrate client
subxt = "0.50"
subxt-rpcs = "0.50"
subxt-signer = { version = "0.50", features = ["subxt", "sr25519"] }

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# Error handling
anyhow = { workspace = true }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Crypto
hex = "0.4"

# HTTP client

# Time
chrono = { workspace = true }

# Hashing for report_id generation
sha2 = "0.10"

# Statistics
statrs = "0.17"

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-hack"]
