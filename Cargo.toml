[workspace]
resolver = "2"
members = [
    "crates/sim-artifacts",
    "crates/sim-core",
    "crates/sim-report",
    "crates/sim-runner",
    "crates/sim-service",
    "crates/testnet-agent-bridge",
    "apps/simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FreshCredit/simulator"
authors = ["The FreshCredit Org <dev@freshcredit.com>"]
readme = "README.md"
keywords = ["agent-society-simulator", "docas", "gtt", "simulation"]
categories = ["science", "simulation"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tower = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
askama = { version = "0.14", features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
