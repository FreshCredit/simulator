<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <meta name="description" content="{% block description %}Agent Society Simulator - Research-Grade ABM for Trust Emergence{% endblock %}">
    <title>{% block title %}Agent Society Simulator | FreshCredit{% endblock %}</title>

    <!-- Google Fonts (same as main app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="bg-background text-foreground min-h-screen flex flex-col md:flex-row" data-sim-service-url="{% block sim_url %}{% endblock %}">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
