[package]
name = "simulator"
version.workspace = true
edition.workspace = true
authors = ["FreshCredit Team"]
description = "Agent Society Simulator - Standalone visualization service"
license = "MIT"

repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
# HTTP server
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
http = "1.0"

# CLI
clap = { workspace = true }

# Serialization
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Templating
askama.workspace = true
# NOTE: askama_axum removed - using askama 0.14 with manual .render()

# HTTP client (for sim-service API calls) with streaming support
reqwest = { workspace = true, features = ["stream"] }

# Async streaming
futures = "0.3"

# Error handling
anyhow = { workspace = true }

# Security - SEC-001: HTML escaping for XSS prevention
html-escape = "0.2"

# NOTE: SIM-001 - No sim-core or product crate dependencies allowed!
# This service only reads artifacts via HTTP API or GCS.

[features]
default = []

[dev-dependencies]
wiremock = "0.6"


[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-hack"]
